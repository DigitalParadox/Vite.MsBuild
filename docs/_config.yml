# Just the Docs theme configuration
remote_theme: just-the-docs/just-the-docs

title: ViteKit.Msbuild Documentation
description: Framework-agnostic MSBuild integration for Vite in ASP.NET Core projects

# GitHub repository info
url: "https://digitalparadox.github.io"
baseurl: "/ViteKit.Msbuild"

aux_links:
  "GitHub":
    - "https://github.com/DigitalParadox/ViteKit.Msbuild"
  "NuGet Package":
    - "https://www.nuget.org/packages/ViteKit.Msbuild"

# Footer configuration
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/DigitalParadox/ViteKit.Msbuild"
gh_edit_branch: "main"

# Search configuration
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true

# Navigation structure
nav_sort: case_insensitive

# Color scheme
color_scheme: light

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Code copy button
enable_copy_code_button: true

# Plugins
plugins:
  - jekyll-seo-tag

# Exclude from site
exclude:
  - node_modules/
  - package*.json
  - .gitignore
  - archive/