# yaml-language-server: $schema=https://raw.githubusercontent.com/GitTools/GitVersion/main/schemas/6.0/GitVersion.configuration.json

mode: ContinuousDeployment
tag-prefix: '[vV]'
major-version-bump-message: '\+semver:\s?(breaking|major)'
minor-version-bump-message: '\+semver:\s?(feature|minor)'
patch-version-bump-message: '\+semver:\s?(fix|patch)'
no-bump-message: '\+semver:\s?(none|skip)'
commit-message-incrementing: Enabled

branches:
  master:
    regex: ^master$|^main$
    label: ''
    increment: Patch
    is-release-branch: true
  develop:
    # Force dev branch to always produce prerelease alpha versions
    regex: ^dev$
    label: alpha
    increment: Minor
    is-release-branch: false
    source-branches: []
    tracks-release-branches: true
  stable:
    regex: ^stable$
    label: beta
    increment: Patch
    is-release-branch: false
  release:
    regex: ^releases?[/-]
    label: rc
    increment: None
    is-release-branch: true

ignore:
  sha: []

merge-message-formats:
  # Conventional Commits support
  '(?:^|\\n)feat(\\(.+\\))?:': Minor
  '(?:^|\\n)fix(\\(.+\\))?:': Patch
  '(?:^|\\n)perf(\\(.+\\))?:': Patch
  '(?:^|\\n)BREAKING[- ]CHANGE:': Major
