name: CI - Build and Unit Tests

permissions:
  contents: write          # release notes, artifacts
  packages: write          # github packages publish
  actions: read            # download artifacts
  checks: write            # create test reporter check runs
  pull-requests: write     # allow PR comments for coverage/test (future)

on:
  push:

env:
  FAIL_ON_TEST_REPORT_ERROR: 'false'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # TODO: Re-add windows-latest before production release
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Build and Test (${{ matrix.os }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.0.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1

      - name: Build and Test
        id: build
        uses: ./.github/actions/build-and-test
        with:
          version: ${{ steps.gitversion.outputs.fullSemVer }}
          test-results-filename: '${{ matrix.os }}.trx'

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Unit Test Results (${{ matrix.os }})
          path: "${{ steps.build.outputs.test-results-relative }}/**/*.trx"
          reporter: dotnet-trx
          list-tests: failed
          max-annotations: 50

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ matrix.os }}
          path: ${{ steps.build.outputs.test-results-relative }}
          retention-days: 7
          
      - name: Upload coverage artifact
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: ${{ steps.build.outputs.coverage-report-relative }}
          retention-days: 7

      - name: Publish coverage summary
        if: always() && matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/publish-github-check
        with:
          check-name: Coverage Summary
          title: Coverage Summary
          summary-file: ${{ steps.build.outputs.coverage-report-relative }}/SummaryGithub.md
          summary: Coverage summary not available.

      - name: Pack NuGet packages
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/pack-and-push-nuget
        with:
          version: ${{ steps.gitversion.outputs.fullSemVer }}
          push-to-nuget: 'false'
          push-to-github: 'false'
          upload-artifact: 'true'
          artifact-name: 'nuget-packages'
          retention-days: '7'


          

