name: CI - Build and Unit Tests

permissions:
  contents: write          # release notes, artifacts
  packages: write          # github packages publish
  actions: read            # download artifacts
  checks: write            # create test reporter check runs
  pull-requests: write     # allow PR comments for coverage/test (future)

on:
  push:

env:
  FAIL_ON_TEST_REPORT_ERROR: 'false'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Build and Test (${{ matrix.os }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Test
        id: build
        uses: ./.github/actions/build-and-test

      - name: Upload test results
        uses: ./.github/actions/publish-test-results
        if: always()
        with:
          test-results-path: "${{ steps.build.outputs.test-results-relative }}/**/*.xml"
          test-check-name: Unit Test Results
          matrix-os: ${{ matrix.os }}
          retention-days: 7
          skip-test-report: true
          skip-coverage-check: true
          
          upload-coverage: ${{ matrix.os == 'ubuntu-latest' }}
          coverage-artifact-path: ${{ steps.build.outputs.coverage-report-relative }}
          coverage-summary-file: ${{ steps.build.outputs.coverage-report-relative }}/SummaryGithub.md

  report-test-results:
    name: Test Results
    runs-on: ubuntu-latest
    needs: build
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Download test results for ${{ matrix.os }}
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results-${{ matrix.os }}
          path: test-results

      - name: Convert JUnit to CTRF
        run: |
          npx --yes junit-to-ctrf test-results/**/*.xml test-results/ctrf-report.json

      - name: Publish test results for ${{ matrix.os }}
        uses: ctrf-io/github-test-reporter@v1
        if: always()
        with:
          report-path: 'test-results/ctrf-report.json'
          github-report: true
          status-check: true
          status-check-name: 'Unit Test Results (${{ matrix.os }})'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report-coverage:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-ubuntu-latest
          path: coverage-report

      - name: Publish coverage summary
        uses: ./.github/actions/publish-github-check
        with:
          check-name: Coverage Summary
          title: Coverage Summary
          summary-file: coverage-report/SummaryGithub.md
          summary: Coverage summary not available.
