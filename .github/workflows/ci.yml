name: CI - Build and Unit Tests

permissions:
  contents: write          # release notes, artifacts
  packages: write          # github packages publish
  actions: read            # download artifacts
  checks: write            # create test reporter check runs
  pull-requests: write     # allow PR comments for coverage/test (future)

on:
  push:

env:
  FAIL_ON_TEST_REPORT_ERROR: 'false'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Build and Test (${{ matrix.os }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Test
        id: build
        uses: ./.github/actions/build-and-test

      - name: Publish test results
        uses: ./.github/actions/publish-test-results
        if: always()
        with:
          test-results-path: "${{ steps.build.outputs.test-results-relative }}/**/*.trx"
          test-check-name: Unit Test Results
          matrix-os: ${{ matrix.os }}
          retention-days: 7
          
          upload-coverage: ${{ matrix.os == 'ubuntu-latest' }}
          coverage-artifact-path: ${{ steps.build.outputs.coverage-report-relative }}
          coverage-summary-file: ${{ steps.build.outputs.coverage-report-relative }}/SummaryGithub.md

  report-coverage:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-ubuntu-latest
          path: coverage-report

      - name: Add coverage to job summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage-report/SummaryGithub.md ]; then
            cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage summary not available." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish coverage summary
        uses: ./.github/actions/publish-github-check
        with:
          check-name: Coverage Summary
          title: Coverage Summary
          summary-file: coverage-report/SummaryGithub.md
          summary: Coverage summary not available.
