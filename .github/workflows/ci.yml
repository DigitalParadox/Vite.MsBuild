name: CI - Build and Unit Tests

on:
  push:
  pull_request:
    branches: [ master, stable, dev ]

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for GitVersion

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v1.2.0
      with:
        versionSpec: '6.0.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v1.2.0
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml

    - name: Display GitVersion outputs
      run: |
        echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
        echo "NuGetVersion (from SemVer): ${{ steps.gitversion.outputs.semVer }}"
        echo "AssemblyVersion: ${{ steps.gitversion.outputs.assemblySemVer }}"

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Display .NET info
      run: dotnet --info

    - name: Restore dependencies
      run: dotnet restore ViteKit.MsBuild.sln

    - name: Build solution (multi-targeting net8.0;net9.0;net10.0)
      shell: pwsh
      run: |
        dotnet build ViteKit.MsBuild.sln `
          --configuration Release `
          --no-restore `
          /p:Version=${{ steps.gitversion.outputs.semVer }} `
          /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} `
          /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} `
          /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

    - name: Pack NuGet package
      if: matrix.os == 'ubuntu-latest'
      shell: pwsh
      run: |
        dotnet pack src/ViteKit.MsBuild.Tasks/ViteKit.MsBuild.Tasks.csproj `
          --configuration Release `
          --no-build `
          --output nupkg `
          /p:PackageVersion=${{ steps.gitversion.outputs.semVer }}

    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest'
      with:
        name: nuget-package
        path: nupkg/*.nupkg
        retention-days: 7

    - name: Run unit tests (all frameworks)
      shell: pwsh
      run: |
        $coverageArgs = @()
        if ('${{ matrix.os }}' -eq 'ubuntu-latest') {
          $coverageArgs = @(
            '--collect',
            '"XPlat Code Coverage"',
            '--settings',
            'coverlet.runsettings'
          )
        }
        dotnet test tests/ViteKit.MsBuild.PureUnitTests/ViteKit.MsBuild.PureUnitTests.csproj `
          --configuration Release `
          --no-build `
          --verbosity normal `
          --logger trx `
          --logger "console;verbosity=detailed" `
          --results-directory "${{ github.workspace }}/TestResults/" `
          $coverageArgs

    - name: Generate coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@5.3.11
      if: matrix.os == 'ubuntu-latest'
      with:
        reports: 'TestResults/**/coverage.cobertura.xml'
        targetdir: 'CoverageReport'
        reporttypes: 'Html;MarkdownSummaryGithub'

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest'
      with:
        name: coverage-report
        path: CoverageReport/
        retention-days: 7

    - name: Add coverage PR comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
      with:
        recreate: true
        path: CoverageReport/SummaryGithub.md

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results-${{ matrix.os }}
        path: TestResults/
        retention-days: 7

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Test Results
        path: "${{ github.workspace }}/TestResults/*.trx"
        reporter: dotnet-trx
