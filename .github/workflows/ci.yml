name: CI - Build and Unit Tests

permissions:
  contents: write          # release notes, artifacts
  packages: write          # github packages publish
  actions: read            # download artifacts
  checks: write            # create test reporter check runs
  pull-requests: write     # allow PR comments for coverage/test (future)

on:
  push:

env:
  FAIL_ON_TEST_REPORT_ERROR: 'false'

jobs:
  version:
    name: Version Info
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      fullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.0.x'

      - name: Determine version with GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1

      - name: Add version info to job summary
        shell: bash
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Version Information
          
          | Property | Value |
          |----------|-------|
          | SemVer | ${{ steps.gitversion.outputs.semVer }} |
          | FullSemVer | ${{ steps.gitversion.outputs.fullSemVer }} |
          | InformationalVersion | ${{ steps.gitversion.outputs.informationalVersion }} |
          | BranchName | ${{ steps.gitversion.outputs.branchName }} |
          | CommitsSinceVersionSource | ${{ steps.gitversion.outputs.commitsSinceVersionSource }} |
          EOF

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Build and Test (${{ matrix.os }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Test
        id: build
        uses: ./.github/actions/build-and-test
        with:
          version: ${{ needs.version.outputs.fullSemVer }}
          matrix-os: ${{ matrix.os }}

      - name: Publish test results
        uses: ./.github/actions/publish-test-results
        if: always()
        with:
          test-results-path: "${{ steps.build.outputs.test-results-relative }}/**/*.trx"
          test-results-directory: "${{ steps.build.outputs.test-results-relative }}"
          test-check-name: Unit Test Results
          matrix-os: ${{ matrix.os }}
          retention-days: 7
          
          upload-coverage: ${{ matrix.os == 'ubuntu-latest' }}
          coverage-artifact-path: ${{ steps.build.outputs.coverage-report-relative }}
          coverage-summary-file: ${{ steps.build.outputs.coverage-report-relative }}/SummaryGithub.md

      - name: Pack NuGet packages
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/pack-and-push-nuget
        with:
          version: ${{ needs.version.outputs.fullSemVer }}
          push-to-nuget: 'false'
          push-to-github: 'false'
          upload-artifact: 'true'
          artifact-name: 'nuget-packages'
          retention-days: '7'

  report-coverage:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-ubuntu-latest
          path: coverage-report

      - name: Add coverage to job summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage-report/SummaryGithub.md ]; then
            cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage summary not available." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish coverage summary
        uses: ./.github/actions/publish-github-check
        with:
          check-name: Coverage Summary
          title: Coverage Summary
          summary-file: coverage-report/SummaryGithub.md
          summary: Coverage summary not available.
