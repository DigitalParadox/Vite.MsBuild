name: CI Test - Build and Unit Tests

permissions:
  contents: write
  packages: write
  actions: read
  checks: write
  pull-requests: write

on:
  push:
    branches: [dev]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Build and Test (${{ matrix.os }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.0.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1

      - name: Restore solution
        run: dotnet restore ViteKit.MsBuild.sln

      - name: Build solution
        run: |
          dotnet build ViteKit.MsBuild.sln \
            --configuration Release \
            --no-restore \
            /p:Version=${{ steps.gitversion.outputs.fullSemVer }}

      - name: Run unit tests
        run: |
          dotnet test tests/ViteKit.MsBuild.PureUnitTests/ViteKit.MsBuild.PureUnitTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=${{ matrix.os }}.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory TestResults \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=coverage/

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Unit Test Results (${{ matrix.os }})
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          list-tests: failed
          max-annotations: 50

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 7

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool update --global dotnet-reportgenerator-globaltool
          reportgenerator "-reports:tests/ViteKit.MsBuild.PureUnitTests/coverage/*.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:Html;MarkdownSummaryGithub"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
          retention-days: 7

      - name: Pack NuGet packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack ViteKit.MsBuild.nuspec \
            /p:NuspecFile=ViteKit.MsBuild.nuspec \
            /p:Version=${{ steps.gitversion.outputs.fullSemVer }} \
            --output nupkg

      - name: Upload NuGet packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nupkg/*.nupkg
          retention-days: 7
