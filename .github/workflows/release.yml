name: Release - Build and Publish NuGet

on:
  push:
    branches:
      - master
      - stable
      - dev
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Publish NuGet Package
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for GitVersion

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v1.2.0
      with:
        versionSpec: '6.0.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v1.2.0
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml

    - name: Display Version
      run: |
        echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
        echo "NuGetVersion (from SemVer): ${{ steps.gitversion.outputs.semVer }}"
        echo "Branch: ${{ steps.gitversion.outputs.branchName }}"

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ViteKit.MsBuild.sln

    - name: Build solution
      shell: pwsh
      run: |
        dotnet build ViteKit.MsBuild.sln `
          --configuration Release `
          --no-restore `
          /p:Version=${{ steps.gitversion.outputs.semVer }} `
          /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} `
          /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} `
          /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

    - name: Run unit tests
      run: |
        dotnet test tests/ViteKit.MsBuild.PureUnitTests/ViteKit.MsBuild.PureUnitTests.csproj \
          --configuration Release \
          --no-build \
          --verbosity normal

    - name: Pack NuGet package
      run: |
        dotnet pack src/ViteKit.MsBuild.Tasks/ViteKit.MsBuild.Tasks.csproj \
          --configuration Release \
          --no-build \
          --output nupkg \
          /p:PackageVersion=${{ steps.gitversion.outputs.semVer }}

    - name: Upload NuGet package artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package-${{ steps.gitversion.outputs.semVer }}
        path: nupkg/*.nupkg
        retention-days: 90

    - name: Push to NuGet.org
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      run: |
        dotnet nuget push nupkg/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Push to GitHub Packages (Pre-releases)
      if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/stable'
      run: |
        dotnet nuget push nupkg/*.nupkg \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --source https://nuget.pkg.github.com/DigitalParadox/index.json \
          --skip-duplicate

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: nupkg/*.nupkg
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(steps.gitversion.outputs.semVer, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
