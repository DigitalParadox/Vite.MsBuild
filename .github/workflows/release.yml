name: Release - Build and Publish NuGet

permissions:
  contents: write
  packages: write
  actions: read
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - master
      - stable
      - dev
    tags:
      - 'v*'

jobs:
  test-ubuntu:
    name: Fast Primary Tests (ubuntu)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for GitVersion

    # Versioning not required for test matrix; executed in pack job.

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ViteKit.MsBuild.sln

    - name: Build solution (Release)
      shell: pwsh
      run: |
        dotnet build ViteKit.MsBuild.sln `
          --configuration Release `
          --no-restore `
          

    - name: Run unit tests (all frameworks)
      shell: pwsh
      run: |
        $testArgs = @(
          'test'
          'tests/ViteKit.MsBuild.PureUnitTests/ViteKit.MsBuild.PureUnitTests.csproj'
          '--configuration','Release'
          '--no-build'
          '--verbosity','normal'
          '--logger','trx'
          '--logger','console;verbosity=detailed'
          '--results-directory','${{ github.workspace }}/TestResults'
        )
        & dotnet @testArgs

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results-ubuntu-latest
        path: TestResults/
        retention-days: 7

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Test Results (ubuntu-latest)
        path: "TestResults/**/*.trx"
        reporter: dotnet-trx

  test-cross:
    name: Cross-Platform Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test-ubuntu
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore ViteKit.MsBuild.sln
    - name: Build solution (Release)
      shell: pwsh
      run: |
        dotnet build ViteKit.MsBuild.sln `
          --configuration Release `
          --no-restore `
    - name: Run unit tests (all frameworks)
      shell: pwsh
      run: |
        $testArgs = @(
          'test'
          'tests/ViteKit.MsBuild.PureUnitTests/ViteKit.MsBuild.PureUnitTests.csproj'
          '--configuration','Release'
          '--no-build'
          '--verbosity','normal'
          '--logger','trx'
          '--logger','console;verbosity=detailed'
          '--results-directory','${{ github.workspace }}/TestResults'
        )
        & dotnet @testArgs
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results-${{ matrix.os }}
        path: TestResults/
        retention-days: 7
    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Test Results (${{ matrix.os }})
        path: "TestResults/**/*.trx"
        reporter: dotnet-trx

  pack:
    name: Pack (Version Stamped)
    runs-on: ubuntu-latest
    needs: test-ubuntu
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      assemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}
      semFileVer: ${{ steps.gitversion.outputs.assemblySemFileVer }}
      informational: ${{ steps.gitversion.outputs.informationalVersion }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v1.2.0
      with:
        versionSpec: '6.0.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v1.2.0
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml

    - name: Debug GitVersion outputs
      run: |
        echo "Branch ref: $GITHUB_REF"
        echo "FullSemVer=${{ steps.gitversion.outputs.fullSemVer }}"
        echo "SemVer=${{ steps.gitversion.outputs.semVer }}"
        echo "AssemblySemVer=${{ steps.gitversion.outputs.assemblySemVer }}"
        echo "InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}"
        echo "BranchName=${{ steps.gitversion.outputs.branchName }}"
        echo "PreReleaseLabel=${{ steps.gitversion.outputs.preReleaseLabel }}"


    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ViteKit.MsBuild.sln

    - name: Build (version stamped)
      run: |
        dotnet build ViteKit.MsBuild.sln \
          --configuration Release \
          --no-restore \
          /p:Version=${{ steps.gitversion.outputs.semVer }} \
          /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} \
          /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} \
          /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

    - name: Pack NuGet package
      run: |
        dotnet pack src/ViteKit.MsBuild.Tasks/ViteKit.MsBuild.Tasks.csproj \
          --configuration Release \
          --no-build \
          --output nupkg \
          /p:PackageVersion=${{ steps.gitversion.outputs.semVer }} \
          /p:Version=${{ steps.gitversion.outputs.semVer }} \
          /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} \
          /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} \
          /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

    - name: Generate changelog fragment
      shell: pwsh
      run: |
        git fetch --tags --quiet
        $lastTag = git describe --tags --abbrev=0 2>$null
        if (-not $lastTag) { $range = 'HEAD' } else { $range = "$lastTag..HEAD" }
        $commits = git log --pretty=format:'%h||%s' $range
        $categories = [ordered]@{
          'feat'='Features';
          'fix'='Bug Fixes';
          'perf'='Performance';
          'refactor'='Refactoring';
          'docs'='Documentation';
          'test'='Tests';
          'build'='Build System';
          'ci'='CI';
          'chore'='Chores';
          'style'='Style';
          'revert'='Reverts'
        }
        $buckets = @{}
        foreach ($key in $categories.Keys) { $buckets[$key] = @() }
        $buckets['other'] = @()
        foreach ($c in $commits) {
          $parts = $c.Split('||',2)
          $hash = $parts[0]
          $subject = $parts[1]
          # Conventional Commit: type(scope)!: description
          if ($subject -match '^(?<type>[a-zA-Z]+)(\([^)]*\))?(!)?:\s*(?<desc>.+)$') {
            $type = $matches.type.ToLower()
            $desc = $matches.desc
            if ($categories.Contains($type)) {
              $buckets[$type] += "* `$hash` $desc"
            } else {
              $buckets['other'] += "* `$hash` $subject"
            }
          } else {
            $buckets['other'] += "* `$hash` $subject"
          }
        }
        $versionHeader = "### Changes"
        if ($env:GITHUB_REF -match 'refs/tags/(v.+)$') { $versionHeader = "### $($matches[1])" }
        $lines = @($versionHeader)
        foreach ($key in $categories.Keys) {
          if ($buckets[$key].Count -gt 0) {
            $lines += "\n#### $($categories[$key])"
            $lines += $buckets[$key]
          }
        }
        if ($buckets['other'].Count -gt 0) {
          $lines += "\n#### Other"
          $lines += $buckets['other']
        }
        $content = ($lines -join "`n") + "`n"
        Set-Content -Path CHANGELOG_FRAGMENT.md -Value $content
        Write-Host "Generated categorized changelog:"; Write-Host $content

    - name: Upload NuGet package artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package-${{ steps.gitversion.outputs.semVer }}
        path: nupkg/*.nupkg
        retention-days: 90

    - name: Create draft GitHub Release (stable only)
      if: startsWith(github.ref, 'refs/tags/v') && !contains(steps.gitversion.outputs.semVer, '-')
      uses: softprops/action-gh-release@v1
      with:
        files: nupkg/*.nupkg
        generate_release_notes: true
        draft: true
        prerelease: false
        body_path: CHANGELOG_FRAGMENT.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-prerelease:
    name: Publish Prerelease
    runs-on: ubuntu-latest
    needs: [pack, test-cross]
    if: contains(needs.pack.outputs.semVer, '-')
    steps:
    - name: Download package artifact
      uses: actions/download-artifact@v4
      with:
        name: nuget-package-${{ needs.pack.outputs.semVer }}
        path: nupkg
    - name: Push to GitHub Packages (prerelease)
      run: |
        dotnet nuget push nupkg/*.nupkg \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --source https://nuget.pkg.github.com/DigitalParadox/index.json \
          --skip-duplicate
    - name: Push to NuGet.org (prerelease)
      run: |
        dotnet nuget push nupkg/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
    - name: Publish prerelease GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: nupkg/*.nupkg
        draft: false
        prerelease: true
        body_path: CHANGELOG_FRAGMENT.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish Stable Release
    runs-on: ubuntu-latest
    needs: [pack, test-cross]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(needs.pack.outputs.semVer, '-')
    environment: production
    steps:
    - name: Download package artifact
      uses: actions/download-artifact@v4
      with:
        name: nuget-package-${{ needs.pack.outputs.semVer }}
        path: nupkg
    - name: Push to NuGet.org (stable)
      run: |
        dotnet nuget push nupkg/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
    - name: Finalize GitHub Release (publish draft)
      uses: softprops/action-gh-release@v1
      with:
        files: nupkg/*.nupkg
        draft: false
        prerelease: false
        body_path: CHANGELOG_FRAGMENT.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

