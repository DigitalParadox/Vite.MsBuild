name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  checks: write

env:
  FAIL_ON_TEST_REPORT_ERROR: 'false'

jobs:
  build:
    name: Build, Test, and Report (${{ matrix.os }})
    if: contains(github.ref_name, '-') == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Test
        id: build
        uses: ./.github/actions/build-and-test
        with:
          test-results-filename: '${{ matrix.os }}.trx'

      - name: Publish test results
        uses: ./.github/actions/publish-test-results
        if: always()
        with:
          test-results-path: "${{ steps.build.outputs.test-results-relative }}/**/*.trx"
          test-results-directory: "${{ steps.build.outputs.test-results-relative }}"
          test-check-name: Unit Test Results
          matrix-os: ${{ matrix.os }}
          retention-days: 14
          
          upload-coverage: ${{ matrix.os == 'ubuntu-latest' }}
          coverage-artifact-path: ${{ steps.build.outputs.coverage-report-relative }}
          coverage-summary-file: ${{ steps.build.outputs.coverage-report-relative }}/SummaryGithub.md

  report-coverage:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-ubuntu-latest
          path: coverage-report

      - name: Add coverage to job summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage-report/SummaryGithub.md ]; then
            cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage summary not available." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish coverage summary
        uses: ./.github/actions/publish-github-check
        with:
          check-name: Coverage Summary
          title: Coverage Summary
          summary-file: coverage-report/SummaryGithub.md
          summary: Coverage summary not available.

  publish:
    name: Pack, Push, and Release
    runs-on: ubuntu-latest
    needs: [build, report-coverage]
    if: contains(github.ref_name, '-') == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.0.x'

      - name: Determine version with GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1

      - name: Set version output
        id: version
        shell: bash
        run: |
          echo "version=${{ steps.gitversion.outputs.semVer }}" >> "$GITHUB_OUTPUT"

      - name: Add version info to job summary
        shell: bash
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Version Information
          
          | Property | Value |
          |----------|-------|
          | SemVer | ${{ steps.gitversion.outputs.semVer }} |
          | FullSemVer | ${{ steps.gitversion.outputs.fullSemVer }} |
          | InformationalVersion | ${{ steps.gitversion.outputs.informationalVersion }} |
          | Major | ${{ steps.gitversion.outputs.major }} |
          | Minor | ${{ steps.gitversion.outputs.minor }} |
          | Patch | ${{ steps.gitversion.outputs.patch }} |
          | PreReleaseTag | ${{ steps.gitversion.outputs.preReleaseTag }} |
          | CommitsSinceVersionSource | ${{ steps.gitversion.outputs.commitsSinceVersionSource }} |
          | BranchName | ${{ steps.gitversion.outputs.branchName }} |
          EOF

      - name: Generate release notes
        id: release_notes
        uses: ./.github/actions/generate-release-notes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ steps.release_notes.outputs.notes_path }}
          retention-days: 14

      - name: Pack and publish NuGet packages
        id: pack
        uses: ./.github/actions/pack-and-push-nuget
        with:
          version: ${{ steps.gitversion.outputs.semVer }}
          push-to-nuget: 'true'
          nuget-api-key: ${{ secrets.NUGET_API_KEY }}
          push-to-github: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-notes: ${{ steps.release_notes.outputs.notes_content }}
          release-notes-file: ${{ steps.release_notes.outputs.notes_path }}

      - name: Publish GitHub release
        uses: ./.github/actions/github-release
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          release_notes_path: ${{ steps.release_notes.outputs.notes_path }}
          release_notes_content: ${{ steps.release_notes.outputs.notes_content }}
          files: "${{ steps.pack.outputs.package-directory }}/*.nupkg"

