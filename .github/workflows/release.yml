name: Release - Build and Publish NuGet

permissions:
  contents: write
  packages: write
  actions: read
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - master
      - stable
      - dev
    tags:
      - 'v*'

jobs:
  test-ubuntu:
    name: Fast Primary Tests (ubuntu)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for GitVersion

    # Versioning not required for test matrix; executed in pack job.

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ViteKit.MsBuild.sln

    - name: Build solution (Release)
      shell: pwsh
      run: |
        dotnet build ViteKit.MsBuild.sln `
          --configuration Release `
          --no-restore `
          

    - name: Run unit tests (all frameworks)
      shell: pwsh
      run: |
        $testArgs = @(
          'test'
          'tests/ViteKit.MsBuild.PureUnitTests/ViteKit.MsBuild.PureUnitTests.csproj'
          '--configuration','Release'
          '--no-build'
          '--verbosity','normal'
          '--logger','trx'
          '--logger','console;verbosity=detailed'
          '--results-directory','${{ github.workspace }}/TestResults'
        )
        & dotnet @testArgs

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results-ubuntu-latest
        path: TestResults/
        retention-days: 7

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Test Results (ubuntu-latest)
        path: "TestResults/**/*.trx"
        reporter: dotnet-trx

  test-cross:
    name: Cross-Platform Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test-ubuntu
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore ViteKit.MsBuild.sln
    - name: Build solution (Release)
      shell: pwsh
      run: |
        dotnet build ViteKit.MsBuild.sln `
          --configuration Release `
          --no-restore `
    - name: Run unit tests (all frameworks)
      shell: pwsh
      run: |
        $testArgs = @(
          'test'
          'tests/ViteKit.MsBuild.PureUnitTests/ViteKit.MsBuild.PureUnitTests.csproj'
          '--configuration','Release'
          '--no-build'
          '--verbosity','normal'
          '--logger','trx'
          '--logger','console;verbosity=detailed'
          '--results-directory','${{ github.workspace }}/TestResults'
        )
        & dotnet @testArgs
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results-${{ matrix.os }}
        path: TestResults/
        retention-days: 7
    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Test Results (${{ matrix.os }})
        path: "TestResults/**/*.trx"
        reporter: dotnet-trx

  pack:
    name: Pack (Version Stamped)
    runs-on: ubuntu-latest
    needs: test-ubuntu
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      assemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}
      semFileVer: ${{ steps.gitversion.outputs.assemblySemFileVer }}
      informational: ${{ steps.gitversion.outputs.informationalVersion }}
      displayTag: ${{ steps.display_tag.outputs.displayTag }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v1.2.0
      with:
        versionSpec: '6.0.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v1.2.0
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml

    - name: Version Spec
      run: |
        echo "Branch ref: $GITHUB_REF"
        echo "FullSemVer=${{ steps.gitversion.outputs.fullSemVer }}"
        echo "SemVer=${{ steps.gitversion.outputs.semVer }}"
        echo "AssemblySemVer=${{ steps.gitversion.outputs.assemblySemVer }}"
        echo "InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}"
        echo "BranchName=${{ steps.gitversion.outputs.branchName }}"
        echo "PreReleaseLabel=${{ steps.gitversion.outputs.preReleaseLabel }}"

    - name: Compute display tag (beta/rc only)
      id: display_tag
      if: steps.gitversion.outputs.preReleaseLabel == 'beta' || steps.gitversion.outputs.preReleaseLabel == 'rc'
      shell: bash
      run: |
        base='${{ steps.gitversion.outputs.majorMinorPatch }}'
        rawLabel='${{ steps.gitversion.outputs.preReleaseLabel }}'   # beta or rc
        if [[ -z "$rawLabel" ]]; then exit 0; fi
        label="-$rawLabel"                           # -beta or -rc
        tag="v${base}${label}"                      # e.g. v0.2.0-beta
        echo "displayTag=$tag" >> $GITHUB_OUTPUT
        echo "Computed displayTag=$tag from base=$base label=$label"



    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ViteKit.MsBuild.sln

    - name: Build (version stamped)
      run: |
        dotnet build ViteKit.MsBuild.sln \
          --configuration Release \
          --no-restore \
          /p:Version=${{ steps.gitversion.outputs.semVer }} \
          /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} \
          /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} \
          /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }} \
          /p:ContinuousIntegrationBuild=true \
          /p:Deterministic=true

    - name: Pack NuGet package (csproj)
      run: |
        dotnet pack src/ViteKit.MsBuild/ViteKit.MsBuild.csproj \
          --configuration Release \
          --no-build \
          --output nupkg \
          /p:PackageVersion=${{ steps.gitversion.outputs.semVer }} \
          /p:Version=${{ steps.gitversion.outputs.semVer }} \
          /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} \
          /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} \
          /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }} \
          /p:IncludeSymbols=true \
          /p:SymbolPackageFormat=snupkg


    - name: Upload NuGet package artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package-${{ steps.gitversion.outputs.semVer }}
        path: nupkg/*.nupkg
        retention-days: 90

    # Inline prerelease publish (alpha, beta, rc) instead of separate job
    - name: Create prerelease tag (beta/rc only, no force)
      if: (steps.gitversion.outputs.preReleaseLabel == 'beta' || steps.gitversion.outputs.preReleaseLabel == 'rc') && steps.display_tag.outputs.displayTag != ''
      run: |
        TAG="${{ steps.display_tag.outputs.displayTag }}"
        git fetch --tags --quiet
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists; leaving unchanged.";
        else
          echo "Creating prerelease tag $TAG";
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
        fi

    - name: Create hotfix stable tag (auto) if missing
      if: (!contains(steps.gitversion.outputs.semVer, '-')) && startsWith(github.ref, 'refs/heads/')
      run: |
        TAG="v${{ steps.gitversion.outputs.semVer }}"
        git fetch --tags --quiet
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Stable tag $TAG already exists.";
        else
          echo "Creating stable (hotfix) tag $TAG";
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
        fi

    - name: Push prerelease packages
      if: contains(steps.gitversion.outputs.semVer, '-')
      run: |
        dotnet nuget push nupkg/*.nupkg \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --source https://nuget.pkg.github.com/DigitalParadox/index.json \
          --skip-duplicate
        dotnet nuget push nupkg/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Publish prerelease GitHub Release (beta/rc only)
      if: (steps.gitversion.outputs.preReleaseLabel == 'beta' || steps.gitversion.outputs.preReleaseLabel == 'rc') && steps.display_tag.outputs.displayTag != ''
      uses: softprops/action-gh-release@v1
      with:
        files: nupkg/*.nupkg
        draft: false
        prerelease: true
        tag_name: ${{ steps.display_tag.outputs.displayTag }}
        name: ${{ steps.display_tag.outputs.displayTag }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create draft GitHub Release (stable only)
      if: startsWith(github.ref, 'refs/tags/v') && !contains(steps.gitversion.outputs.semVer, '-')
      uses: softprops/action-gh-release@v1
      with:
        files: nupkg/*.nupkg
        generate_release_notes: true
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  publish-release:
    name: Publish Stable Release
    runs-on: ubuntu-latest
    needs: [pack, test-cross]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(needs.pack.outputs.semVer, '-')
    environment: production
    steps:
    - name: Download package artifact
      uses: actions/download-artifact@v4
      with:
        name: nuget-package-${{ needs.pack.outputs.semVer }}
        path: nupkg
    - name: Push to NuGet.org (stable)
      run: |
        dotnet nuget push nupkg/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
    - name: Finalize GitHub Release (publish draft)
      uses: softprops/action-gh-release@v1
      with:
        files: nupkg/*.nupkg
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

