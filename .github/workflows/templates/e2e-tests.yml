name: Reusable E2E Tests

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system to run on'
        required: false
        type: string
        default: 'ubuntu-latest'
      dotnet-version:
        description: '.NET version to use'
        required: false
        type: string
        default: '8.0.x'
      configuration:
        description: 'Build configuration'
        required: false
        type: string
        default: 'Release'

jobs:
  e2e-tests:
    runs-on: ${{ inputs.os }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9

    - name: Install yarn
      run: npm install -g yarn

    - name: Install bun (Ubuntu/macOS)
      if: runner.os != 'Windows'
      run: curl -fsSL https://bun.sh/install | bash

    - name: Install bun (Windows)
      if: runner.os == 'Windows'
      run: |
        powershell -c "irm bun.sh/install.ps1 | iex"
        echo "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Verify package managers
      shell: pwsh
      run: |
        node --version
        npm --version
        pnpm --version
        yarn --version
        bun --version

    - name: Restore dependencies
      run: dotnet restore tests/ViteKit.MsBuild.E2ETests

    - name: Prepare test package
      shell: pwsh
      run: |
        if (-not (Test-Path "nupkg")) {
          New-Item -ItemType Directory -Name "nupkg" | Out-Null
        }
        
        $testPackageDir = "nupkg/test-package"
        if (Test-Path $testPackageDir) {
          Remove-Item $testPackageDir -Recurse -Force
        }
        New-Item -ItemType Directory -Path "$testPackageDir/build" -Force | Out-Null
        Copy-Item "build/*.props" "$testPackageDir/build/"
        Copy-Item "build/*.targets" "$testPackageDir/build/"
        
        Write-Host "[OK] Test package prepared"

    - name: Run E2E tests
      run: |
        dotnet test tests/ViteKit.MsBuild.E2ETests \
          --configuration ${{ inputs.configuration }} \
          --verbosity normal \
          --logger trx \
          --logger "console;verbosity=detailed" \
          --results-directory TestResults \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=opencover

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results-${{ inputs.os }}-${{ inputs.dotnet-version }}
        path: TestResults/
        retention-days: 7

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: E2E Test Results (${{ inputs.os }} - .NET ${{ inputs.dotnet-version }})
        path: TestResults/*.trx
        reporter: dotnet-trx
