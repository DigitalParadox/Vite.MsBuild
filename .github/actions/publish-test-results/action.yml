name: Publish Test Results
description: Upload unit test results, publish GitHub checks, and optionally upload coverage artifacts.
inputs:
  test-results-path:
    description: Workspace-relative path containing TRX files (including optional glob wildcards).
    required: true
  test-results-directory:
    description: Directory path (without glob) for artifact upload. Defaults to test-results-path if not provided.
    required: false
    default: ''
  test-check-name:
    description: Name for the unit test GitHub check.
    required: false
    default: Unit Test Results
  retention-days:
    description: Artifact retention period in days for test results and coverage uploads.
    required: false
    default: '7'
  fail-on-test-report-error:
    description: When true, fail the workflow if the test reporter step fails.
    required: false
    default: 'false'
  upload-coverage:
    description: When true, upload coverage artifacts and publish a coverage summary check.
    required: false
    default: 'true'
  coverage-artifact-path:
    description: Workspace-relative directory containing coverage reports.
    required: false
    default: ''
  coverage-summary-file:
    description: Workspace-relative path to the Markdown summary (e.g., SummaryGithub.md).
    required: false
    default: ''
  coverage-check-name:
    description: Name of the coverage GitHub check when coverage is uploaded.
    required: false
    default: Coverage Summary
  matrix-os:
    description: Optional string appended to artifact/check names (typically the matrix OS).
    required: false
    default: ''
  skip-test-report:
    description: When true, skip creating the test report check run (useful when aggregating results in a separate job).
    required: false
    default: 'false'
  skip-coverage-check:
    description: When true, skip creating the coverage check run.
    required: false
    default: 'false'
  job-summary:
    description: When true, include test results in the job summary.
    required: false
    default: 'true'
outputs:
  test-results-artifact:
    description: Name of the uploaded test results artifact.
    value: ${{ steps.upload_test_results.outputs.artifact-name }}
runs:
  using: composite
  steps:
    - name: Parse test results
      id: parse_tests
      if: always() && inputs.skip-test-report != 'true'
      shell: pwsh
      run: |
        $trxFiles = Get-ChildItem -Path "${{ inputs.test-results-path }}" -File
        $totalTests = 0
        $passedTests = 0
        $failedTests = 0
        $skippedTests = 0
        
        foreach ($file in $trxFiles) {
          [xml]$trx = Get-Content $file.FullName
          $counters = $trx.TestRun.ResultSummary.Counters
          $totalTests += [int]$counters.total
          $passedTests += [int]$counters.passed
          $failedTests += [int]$counters.failed
          $skippedTests += [int]$counters.inconclusive + [int]$counters.notExecuted
        }
        
        Add-Content -Path $env:GITHUB_OUTPUT -Value "total=$totalTests"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "passed=$passedTests"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "failed=$failedTests"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "skipped=$skippedTests"
        
        $status = if ($failedTests -gt 0) { "❌" } else { "✅" }
        $summary = "## $status Test Results${{ inputs.matrix-os && format(' ({0})', inputs.matrix-os) || '' }}`n`n"
        $summary += "| Total | Passed | Failed | Skipped |`n"
        $summary += "|-------|--------|--------|---------|`n"
        $summary += "| $totalTests | $passedTests | $failedTests | $skippedTests |`n"
        
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

    - name: Upload test results artifact
      id: upload_test_results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ inputs.matrix-os && format('unit-test-results-{0}', inputs.matrix-os) || 'unit-test-results' }}
        path: ${{ inputs.test-results-directory || inputs.test-results-path }}
        retention-days: ${{ inputs.retention-days }}

    - name: Upload coverage artifact
      if: always() && inputs.upload-coverage == 'true' && inputs.coverage-artifact-path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.matrix-os && format('coverage-report-{0}', inputs.matrix-os) || 'coverage-report' }}
        path: ${{ inputs.coverage-artifact-path }}
        retention-days: ${{ inputs.retention-days }}

    - name: Publish coverage summary
      if: always() && inputs.upload-coverage == 'true' && inputs.coverage-summary-file != '' && inputs.skip-coverage-check != 'true'
      uses: ./.github/actions/publish-github-check
      with:
        check-name: ${{ inputs.coverage-check-name }}
        title: ${{ inputs.coverage-check-name }}
        summary-file: ${{ inputs.coverage-summary-file }}
        summary: Coverage summary not available.
